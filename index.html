<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iPhone Camera Clone</title>
<style>
    body {
        margin: 0;
        background: black;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .camera-container {
        width: 360px;
        height: 720px;
        background: black;
        border-radius: 40px;
        border: 2px solid #222;
        overflow: hidden;
        position: relative;
    }

    video, #photo {
        width: 100%;
        height: 75%;
        object-fit: cover;
        border-radius: 20px;
        margin-top: 60px;
    }

    #photo {
        display: none;
    }

    /* Top Bar */
    .top-bar {
        position: absolute;
        top: 15px;
        width: 100%;
        text-align: center;
        font-size: 15px;
        opacity: 0.8;
        z-index: 20;
    }

    /* Modes */
    .modes {
        display: flex;
        justify-content: space-around;
        margin-top: 10px;
        font-size: 16px;
    }
    .mode {
        opacity: 0.5;
        transition: 0.3s;
    }
    .mode.active {
        opacity: 1;
        color: #ffd900;
        font-weight: bold;
    }

    /* Shutter */
    .shutter-area {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 40px;
        z-index: 10;
    }

    .shutter {
        width: 80px;
        height: 80px;
        border: 6px solid white;
        border-radius: 50%;
        background: rgba(255,255,255,0.8);
        cursor: pointer;
        transition: 0.2s;
    }
    .shutter:active {
        transform: scale(0.9);
        background: white;
    }

    /* Back button */
    .back-btn {
        width: 60px;
        height: 60px;
        border: 3px solid white;
        border-radius: 50%;
        display: none;
    }

    /* Tap to Focus effect */
    .focus-ring {
        position: absolute;
        border: 2px solid yellow;
        width: 80px;
        height: 80px;
        border-radius: 10px;
        transform: translate(-40px, -40px);
        pointer-events: none;
        opacity: 0;
        transition: opacity 0.3s, transform 0.2s;
    }

    /* Flash effect */
    .flash-screen {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: white;
        opacity: 0;
        pointer-events: none;
        transition: 0.25s;
    }

    /* Zoom wheel */
    .zoom-controls {
        position: absolute;
        bottom: 130px;
        width: 100%;
        text-align: center;
        z-index: 20;
    }

    .zoom-btn {
        display: inline-block;
        background: rgba(0,0,0,0.5);
        padding: 10px 18px;
        border-radius: 25px;
        margin: 0 8px;
        border: 1px solid white;
        font-size: 14px;
        cursor: pointer;
    }

    .zoom-btn.active {
        background: white;
        color: black;
        font-weight: bold;
    }

    /* Camera Flip Button */
    .flipBtn {
        position: absolute;
        right: 20px;
        bottom: 140px;
        font-size: 28px;
        cursor: pointer;
        opacity: 0.8;
    }
</style>
</head>
<body>

<div class="camera-container">

    <div class="top-bar">● ○ 1x &nbsp;&nbsp; Portrait OFF</div>

    <video id="camera" autoplay playsinline></video>
    <img id="photo">

    <div class="focus-ring" id="focusRing"></div>
    <div class="flash-screen" id="flashScreen"></div>

    <!-- Zoom -->
    <div class="zoom-controls">
        <span class="zoom-btn" onclick="setZoom(0.5)">0.5x</span>
        <span class="zoom-btn active" onclick="setZoom(1)">1x</span>
        <span class="zoom-btn" onclick="setZoom(2)">2x</span>
    </div>

    <!-- Flip Camera -->
    <div class="flipBtn" onclick="flipCamera()">🔄</div>

    <div class="modes">
        <div class="mode">PORTRAIT</div>
        <div class="mode active">PHOTO</div>
        <div class="mode">VIDEO</div>
    </div>

    <div class="shutter-area">
        <div class="back-btn" id="backBtn" onclick="backToCamera()"></div>
        <div class="shutter" onclick="takePhoto()"></div>
    </div>

</div>

<script>
    let video = document.getElementById("camera");
    let photo = document.getElementById("photo");
    let focusRing = document.getElementById("focusRing");
    let flashScreen = document.getElementById("flashScreen");
    let backBtn = document.getElementById("backBtn");

    let currentStream;
    let facingMode = "environment";

    // Start Camera
    async function startCamera() {
        if (currentStream) {
            currentStream.getTracks().forEach(t => t.stop());
        }

        try {
            currentStream = await navigator.mediaDevices.getUserMedia({
                video: { facingMode: facingMode }
            });
            video.srcObject = currentStream;
        } catch (err) {
            alert("Camera Blocked!");
        }
    }
    startCamera();

    // Flip Camera
    function flipCamera() {
        facingMode = facingMode === "environment" ? "user" : "environment";
        startCamera();
    }

    // Tap to focus (fake effect)
    video.addEventListener("click", (e) => {
        let rect = video.getBoundingClientRect();
        let x = e.clientX - rect.left;
        let y = e.clientY - rect.top;

        focusRing.style.left = x + "px";
        focusRing.style.top = y + "px";
        focusRing.style.opacity = 1;
        focusRing.style.transform = "translate(-40px, -40px) scale(1.2)";

        setTimeout(() => {
            focusRing.style.opacity = 0;
        }, 600);
    });

    // Shutter Flash
    function shutterFlash() {
        flashScreen.style.opacity = 1;
        setTimeout(() => flashScreen.style.opacity = 0, 150);
    }

    // Take photo
    function takePhoto() {
        shutterFlash();

        let canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        canvas.getContext("2d").drawImage(video, 0, 0);
        photo.src = canvas.toDataURL("image/png");

        video.style.display = "none";
        photo.style.display = "block";
        backBtn.style.display = "block";
    }

    function backToCamera() {
        photo.style.display = "none";
        video.style.display = "block";
        backBtn.style.display = "none";
    }

    // Zoom Controls
    function setZoom(level) {
        let track = currentStream.getVideoTracks()[0];
        let capabilities = track.getCapabilities();

        document.querySelectorAll(".zoom-btn").forEach(btn => btn.classList.remove("active"));

        if (capabilities.zoom) {
            track.applyConstraints({ advanced: [{ zoom: level }] });
        }

        // Mark active button
        let buttons = document.querySelectorAll(".zoom-btn");
        buttons.forEach(btn => {
            if (btn.innerText === level + "x") btn.classList.add("active");
        });
    }
</script>

</body>
</html>
