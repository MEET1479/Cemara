<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>iPhone Camera + Night Vision</title>
<style>
    body {
        margin: 0;
        background: black;
        font-family: -apple-system, BlinkMacSystemFont, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        color: white;
    }

    .camera-container {
        width: 360px;
        height: 720px;
        background: black;
        border-radius: 40px;
        border: 2px solid #222;
        overflow: hidden;
        position: relative;
    }

    video, #photo {
        width: 100%;
        height: 75%;
        object-fit: cover;
        border-radius: 20px;
        margin-top: 60px;
        transition: filter 0.3s ease-in-out;
    }

    #photo { display: none; }

    /* TOP BAR */
    .top-bar {
        position: absolute;
        top: 15px;
        width: 100%;
        text-align: center;
        font-size: 15px;
        opacity: 0.9;
        z-index: 20;
    }

    /* NIGHT VISION INDICATOR */
    .night-mode-label {
        position: absolute;
        top: 40px;
        right: 10px;
        padding: 6px 12px;
        background: rgba(0,255,0,0.2);
        border: 1px solid #00ff55;
        border-radius: 8px;
        font-size: 12px;
        display: none;
    }

    .night-toggle {
        position: absolute;
        left: 15px;
        top: 40px;
        padding: 6px 12px;
        border: 1px solid white;
        border-radius: 10px;
        cursor: pointer;
        font-size: 12px;
        background: rgba(255,255,255,0.1);
    }

    /* Modes */
    .modes { display: flex; justify-content: space-around; margin-top: 10px; }
    .mode { opacity: 0.5; }
    .mode.active { opacity: 1; color: #ffd900; font-weight: bold; }

    /* Shutter */
    .shutter-area {
        position: absolute;
        bottom: 30px;
        width: 100%;
        display: flex;
        justify-content: center;
        gap: 40px;
    }

    .shutter {
        width: 80px;
        height: 80px;
        border: 6px solid white;
        border-radius: 50%;
        background: rgba(255,255,255,0.8);
        cursor: pointer;
    }

    .back-btn {
        width: 60px; height: 60px;
        border: 3px solid white;
        border-radius: 50%;
        display: none;
    }

    .flash-screen {
        position: absolute; top: 0; left: 0;
        width: 100%; height: 100%;
        background: white;
        opacity: 0; transition: 0.25s;
    }

    .zoom-controls {
        position: absolute;
        bottom: 130px;
        width: 100%;
        text-align: center;
    }
    .zoom-btn {
        display: inline-block;
        background: rgba(0,0,0,0.5);
        padding: 10px 18px;
        border-radius: 25px;
        margin: 0 8px;
        border: 1px solid white;
        cursor: pointer;
    }
    .zoom-btn.active { background: white; color: black; }

    .flipBtn {
        position: absolute;
        right: 20px;
        bottom: 140px;
        font-size: 28px;
        cursor: pointer;
    }
</style>
</head>
<body>

<div class="camera-container">

    <div class="top-bar">● ○ 1x &nbsp;&nbsp; Portrait OFF</div>

    <div class="night-toggle" onclick="toggleNightVision()">Night Vision</div>
    <div class="night-mode-label" id="nightLabel">NIGHT VISION</div>

    <video id="camera" autoplay playsinline></video>
    <img id="photo">

    <div class="flash-screen" id="flashScreen"></div>

    <div class="zoom-controls">
        <span class="zoom-btn" onclick="setZoom(0.5)">0.5x</span>
        <span class="zoom-btn active" onclick="setZoom(1)">1x</span>
        <span class="zoom-btn" onclick="setZoom(2)">2x</span>
    </div>

    <div class="flipBtn" onclick="flipCamera()">🔄</div>

    <div class="modes">
        <div class="mode">PORTRAIT</div>
        <div class="mode active">PHOTO</div>
        <div class="mode">VIDEO</div>
    </div>

    <div class="shutter-area">
        <div class="back-btn" id="backBtn" onclick="backToCamera()"></div>
        <div class="shutter" onclick="takePhoto()"></div>
    </div>

</div>


<script>
    let video = document.getElementById("camera");
    let photo = document.getElementById("photo");
    let flashScreen = document.getElementById("flashScreen");
    let backBtn = document.getElementById("backBtn");
    let nightLabel = document.getElementById("nightLabel");

    let currentStream;
    let facingMode = "environment";
    let nightVision = false;

    async function startCamera() {
        if (currentStream) currentStream.getTracks().forEach(t => t.stop());

        currentStream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode }
        });

        video.srcObject = currentStream;
    }
    startCamera();

    function flipCamera() {
        facingMode = (facingMode === "environment") ? "user" : "environment";
        startCamera();
    }

    // ********* NIGHT VISION FILTER *********
    function toggleNightVision() {
        nightVision = !nightVision;

        if (nightVision) {
            video.style.filter =
                "brightness(2.5) contrast(2) saturate(3) hue-rotate(90deg)";
            nightLabel.style.display = "block";
        } else {
            video.style.filter = "none";
            nightLabel.style.display = "none";
        }
    }

    function shutterFlash() {
        flashScreen.style.opacity = 1;
        setTimeout(() => flashScreen.style.opacity = 0, 150);
    }

    function takePhoto() {
        shutterFlash();

        let canvas = document.createElement("canvas");
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        let ctx = canvas.getContext("2d");

        if (nightVision) {
            ctx.filter =
                "brightness(2.5) contrast(2) saturate(3) hue-rotate(90deg)";
        }

        ctx.drawImage(video, 0, 0);
        photo.src = canvas.toDataURL("image/png");

        video.style.display = "none";
        photo.style.display = "block";
        backBtn.style.display = "block";
    }

    function backToCamera() {
        photo.style.display = "none";
        video.style.display = "block";
        backBtn.style.display = "none";
    }

    function setZoom(level) {
        let track = currentStream.getVideoTracks()[0];
        let cap = track.getCapabilities();

        document.querySelectorAll(".zoom-btn")
            .forEach(btn => btn.classList.remove("active"));

        if (cap.zoom) track.applyConstraints({ advanced: [{ zoom: level }] });

        document.querySelectorAll(".zoom-btn")
            .forEach(btn => {
                if (btn.innerText === level + "x") btn.classList.add("active");
            });
    }
</script>

</body>
</html>
